sentence=Scalable N-anchor UWB indoor positioning for the Makerfabs ESP32 UWB Pro (DW1000).
paragraph=Clean DS-TWR ranging + round-robin TDMA scheduling on top of the proven low-level DW1000 register driver (interrupts serviced in task context, never in ISR), removing the upstream library's ~4-anchor and single-tag limits. Dual-tag TDMA is coordinated over a wired UART link (TagLink): the master tag owns the schedule and alone streams raw ranges (UDP or USB serial) to the host for multilateration and EKF filtering. IMU (BNO085) support is designed in.
